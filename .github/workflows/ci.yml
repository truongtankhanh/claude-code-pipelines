name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validate plugin and pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pipeline structure
        run: node scripts/check-pipelines.mjs
      - name: Formatting
        run: npx --yes prettier@3 --check .
      - name: Plugin and marketplace manifests
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugins/steel
